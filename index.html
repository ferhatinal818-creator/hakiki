<style>
/* Düzen: tek sütun uygulama (max 560px), üstte mühür logo, altta 4 sekme. Güven imgesi: "Hakiki" damgası; sonuçlar mühür olarak basılır. */
:root{
  --bg:#e7ecef; --surface:#ffffff; --surface2:#f1f5f7; --ink:#14202b; --ink2:#4e5d6a; --line:#cbd5dc;

  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1418; --surface:#15202a; --surface2:#1c2a35; --ink:#e8eef2; --ink2:#a4b3be; --line:#2a3946;
  --seal:#5fd3bb; --seal-ink:#04211b; --seal-soft:#12372f;
  --warn:#f3b35c; --warn-soft:#3a2a0e; --bad:#ff9d93; --bad-soft:#46201c; --focus:#ffd24a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1418; --surface:#15202a; --surface2:#1c2a35; --ink:#e8eef2; --ink2:#a4b3be; --line:#2a3946;
  --seal:#5fd3bb; --seal-ink:#04211b; --seal-soft:#12372f;
  --warn:#f3b35c; --warn-soft:#3a2a0e; --bad:#ff9d93; --bad-soft:#46201c; --focus:#ffd24a; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:100%}html.big{font-size:120%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f-body);padding-inline:16px;padding-block:10px 104px;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.45rem/1 var(--f-disp);letter-spacing:-.01em}
.brand svg{width:38px;height:38px;color:var(--seal)}
.brand small{display:block;font:600 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.icon{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
h1{font:800 clamp(1.7rem,6.4vw,2.25rem)/1.1 var(--f-disp);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:700 1.2rem/1.2 var(--f-disp);margin:0}
h3{font:700 1.02rem/1.25 var(--f-disp);margin:0}
p{margin:0}.mute{color:var(--ink2)}.small{font-size:.9rem}
.sec{font:700 .78rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:6px 0 -6px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel>*+*{margin-top:12px}
.panel.seal{border-color:var(--seal);background:var(--seal-soft)}
.panel.warn{border-color:var(--warn);background:var(--warn-soft)}
.panel.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.btn{border:0;border-radius:14px;background:var(--seal);color:var(--seal-ink);font:700 1rem var(--f-disp);padding:12px 18px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.alt{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--warn);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.warn{color:#1b1204}:root:not([data-theme="light"]) .btn.bad{color:#2a0a07}}
:root[data-theme="dark"] .btn.warn{color:#1b1204}:root[data-theme="dark"] .btn.bad{color:#2a0a07}
.btn.lg{min-height:64px;font-size:1.08rem;padding:14px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.92rem;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],input[type=password],input[type=tel],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;min-height:48px}
textarea{min-height:92px;resize:vertical;font-family:var(--f-mono);font-size:.95rem}
label.f{display:flex;flex-direction:column;gap:5px;font:600 .9rem var(--f-body);color:var(--ink2)}

.tag{display:inline-block;border-radius:999px;padding:1px 10px;font:700 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}

.fp{font:500 .85rem var(--f-mono);color:var(--ink2)}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}

.code span{display:inline-block;margin-inline:.12em}
/* süre çubuğu */
.timebar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:14px}
.timebar b{display:block;height:100%;width:100%;background:var(--seal);border-radius:6px;transition:width .25s linear}
.timebar b.low{background:var(--warn)}
.bignum{font:600 2.2rem/1 var(--f-mono);letter-spacing:.08em;text-align:center;font-variant-numeric:tabular-nums}
.stamp{width:min(168px,48vw);display:block;margin-inline:auto;transform:rotate(-8deg);color:var(--seal);animation:press .45s cubic-bezier(.2,.9,.3,1.2) both}

.bubble{border-radius:14px;padding:10px 14px;max-width:92%;background:var(--surface2);border:1.5px solid var(--line)}

.prog{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.prog b{display:block;height:100%;background:var(--seal)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 .92rem var(--f-body);z-index:30;max-width:90vw}
.sw{width:54px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink2);transition:.15s}
.sw[aria-checked="true"]{background:var(--seal);border-color:var(--seal)}.sw[aria-checked="true"]::after{left:25px;background:var(--seal-ink)}
ul.clean{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px}
ol.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--seal);color:var(--seal-ink);font:800 .95rem var(--f-disp);display:grid;place-items:center;margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.invite{font:600 1.05rem/1.7 var(--f-mono);overflow-wrap:anywhere;letter-spacing:.04em;background:var(--surface2);border:1.5px dashed var(--seal);border-radius:12px;padding:12px;text-align:center;user-select:all}
a{color:var(--seal)}
.lock{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ===== HAKİKİ · kriptografik çekirdek (tarayıcı + node) ===== */
const HK=(()=>{
const subtle=globalThis.crypto&&globalThis.crypto.subtle;
const enc=new TextEncoder();
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const STEP=30;
const WORDS=('kale deniz elma kuş bulut nehir çiçek dağ yıldız ay güneş rüzgar yağmur kar orman ada köprü liman vapur simit çay bal zeytin incir nar üzüm kiraz limon ceviz fındık badem kedi köpek kuzu kartal serçe leylek martı balık yunus arı karınca kaplan aslan tilki kurt ceylan at lale gül papatya sümbül menekşe çam meşe ardıç kavak taş kum toprak ateş buz sis şimşek harita pusula fener anahtar kapı pencere çatı merdiven masa sandalye kitap kalem defter saat zil davul saz ney gitar top uçurtma bisiklet tren otobüs uçak gemi sepet bardak tabak kaşık çanta şemsiye ayna halı kilim lamba mum perde yastık battaniye bahçe tarla çeşme kuyu göl yol tepe vadi plaj kayık yelken çapa kervan rıhtım sahil dalga fırtına şafak gün akşam yaprak dal kök meyve').split(' ').slice(0,128);

function rand(n){const a=new Uint8Array(n);globalThis.crypto.getRandomValues(a);return a;}
function b32e(u8){let bits=0,val=0,out='';for(const b of u8){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5;}val&=(1<<bits)-1;}if(bits>0)out+=B32[(val<<(5-bits))&31];return out;}
function b32d(s){let bits=0,val=0;const out=[];for(const ch of s){const i=B32.indexOf(ch);if(i<0)throw new Error('geçersiz karakter');val=(val<<5)|i;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8;}val&=(1<<bits)-1;}return new Uint8Array(out);}
const b64e=u8=>btoa(String.fromCharCode(...u8));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha256(u8){return new Uint8Array(await subtle.digest('SHA-256',u8));}
async function hmac(key,data,hash='SHA-256'){const k=await subtle.importKey('raw',key,{name:'HMAC',hash},false,['sign']);return new Uint8Array(await subtle.sign('HMAC',k,data));}
async function hotp(key,counter,digits=6,hash='SHA-256'){const m=new Uint8Array(8);const dv=new DataView(m.buffer);dv.setUint32(0,Math.floor(counter/4294967296));dv.setUint32(4,counter>>>0);const h=await hmac(key,m,hash);const o=h[h.length-1]&15;const bin=((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3];return String(bin%(10**digits)).padStart(digits,'0');}
async function deriveKey(secret,label){return hmac(secret,enc.encode('hakiki/v1/'+label));}
const counterAt=(t=Date.now())=>Math.floor(t/1000/STEP);
const secsLeft=(t=Date.now())=>STEP-Math.floor(t/1000)%STEP;
/* kind: 'C' normal kod, 'D' baskı kodu. role: kodu üreten tarafın rolü (0 davet eden, 1 davet edilen) */
async function code(secret,role,counter,kind='C'){return hotp(await deriveKey(secret,kind+role),counter);}
const clean=s=>String(s).replace(/\D/g,'');
function same(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0;}
/* karşı tarafın okuduğu kodu doğrula: ok | duress | bad */
async function verify(secret,peerRole,input,t=Date.now()){const x=clean(input);if(x.length!==6)return{r:'bad',why:'uzunluk'};const c=counterAt(t);let found=null;
  for(const d of [0,-1,1]){const n=await code(secret,peerRole,c+d,'C');if(same(n,x)&&!found)found={r:'ok',drift:d};}
  if(found)return found;
  for(const d of [0,-1,1]){const n=await code(secret,peerRole,c+d,'D');if(same(n,x))return{r:'duress',drift:d};}
  return{r:'bad'};}
function newChallenge(){const u=new Uint32Array(1);globalThis.crypto.getRandomValues(u);return String(u[0]%1000000).padStart(6,'0');}
async function respond(secret,responderRole,challenge){const x=clean(challenge);if(x.length!==6)throw new Error('6 haneli sayı gerekli');return hotp(await deriveKey(secret,'R'+responderRole),parseInt(x,10));}
async function checkAnswer(secret,peerRole,challenge,answer){const exp=await respond(secret,peerRole,challenge);return same(exp,clean(answer));}
async function fingerprint(secret){const h=await sha256(secret);return [WORDS[h[0]&127],WORDS[h[1]&127],WORDS[h[2]&127]];}
async function invite(secret){const c=(await sha256(secret)).slice(0,2);const p=new Uint8Array(22);p.set(secret);p.set(c,20);const s=b32e(p);return 'HK1-'+s.match(/.{1,4}/g).join('-');}
async function parseInvite(str){let s=String(str).trim().toUpperCase();if(!s.startsWith('HK1'))throw new Error('Kod HK1 ile başlamalı.');s=s.slice(3).replace(/0/g,'O').replace(/1/g,'I').replace(/[^A-Z2-7]/g,'');if(s.length!==36)throw new Error('Kod eksik ya da fazla. 36 karakter olmalı.');const b=b32d(s);if(b32e(b)!==s)throw new Error('Kodda yazım hatası var. Karakterleri tek tek kontrol edin.');const secret=b.slice(0,20);const chk=(await sha256(secret)).slice(0,2);if(chk[0]!==b[20]||chk[1]!==b[21])throw new Error('Kodda yazım hatası var. Karakterleri tek tek kontrol edin.');return secret;}
async function pinKey(pin,salt){const km=await subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(obj,pin){const salt=rand(16),iv=rand(12);const k=await pinKey(pin,salt);const ct=new Uint8Array(await subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj))));return{salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)};}
async function unseal(blob,pin){const k=await pinKey(pin,b64d(blob.salt));const pt=await subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv)},k,b64d(blob.ct));return JSON.parse(new TextDecoder().decode(pt));}
const supported=!!subtle&&!!globalThis.crypto.getRandomValues;
return{STEP,WORDS,rand,b32e,b32d,b64e,b64d,hotp,code,counterAt,secsLeft,verify,newChallenge,respond,checkAnswer,fingerprint,invite,parseInvite,seal,unseal,supported,clean,enc};
})();
if(typeof module!=='undefined')module.exports=HK;
;
(()=>{'use strict';

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY='hakiki.v1';
let S=null,PIN=null,persist=true,route='onboard',cur=null,mode='check',sub='code',addStep='choose',newC=null,joinSecret=null,joinFp=null;
let vres=null,qchal=null,qres=null,qdemo=null,rres=null,duressShown=false,detailReveal=false,delSure=false,wipeSure=false;
const fails={};let timer=null,lastCnt=-1,toastT=null,lastReport='';

const RELS=['Anne','Baba','Eş','Ağabey / Abla','Kardeş','Oğlum / Kızım','Dede / Nine','Amca / Dayı / Hala / Teyze','Arkadaş','İş arkadaşı','Diğer'];

const initial=n=>(n.trim()[0]||'?').toLocaleUpperCase('tr');

 return `<svg class="stamp ${cls}" viewBox="0 0 200 200" role="img" aria-label="${t}"><defs><path id="${id}" d="M100,100 m-77,0 a77,77 0 1,1 154,0 a77,77 0 1,1 -154,0"/></defs><circle cx="100" cy="100" r="93" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="100" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="2"/><text font-size="19" font-weight="800" fill="currentColor"><textPath href="#${id}" textLength="476" lengthAdjust="spacing">${ring}</textPath></text><path d="${g}" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

function speak(t){try{if(!('speechSynthesis' in window)){toast('Bu cihazda sesli okuma yok.');return;}const v=speechSynthesis.getVoices().find(x=>/^tr/i.test(x.lang));if(!v){toast('Cihazda Türkçe ses yok.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.voice=v;u.rate=.9;speechSynthesis.speak(u);}catch(e){toast('Sesli okuma çalışmadı.');}}

 settings(){go('settings');},
 async tbig(){S.settings.big=!S.settings.big;applyTheme();await save();render(false);},
 async pinon(){const a=$('#pin1').value,b=$('#pin2').value,e=$('#perr');if(!/^\d{4,12}$/.test(a)){e.textContent='PIN 4 ile 12 rakam arasında olmalı.';return;}if(a!==b){e.textContent='İki PIN aynı değil.';return;}PIN=a;S.settings.pin=true;await save();toast('PIN açıldı');render(false);},
 async pinoff(){S.settings.pin=false;PIN=null;await save();toast('PIN kaldırıldı');render(false);},
 async wipe(){if(!wipeSure){wipeSure=true;render(false);setTimeout(()=>{wipeSure=false;if(route==='settings')render(false);},4000);return;}await doWipe();},
 async wipe1(){if(!wipeSure){wipeSure=true;const b=$('[data-act=wipe1]');b.textContent='Emin misiniz? Tekrar dokunun';setTimeout(()=>{wipeSure=false;if(b.isConnected)b.textContent='PIN’i unuttum, verileri sil';},4000);return;}await doWipe();},
 async unlock(){const p=$('#pinin').value;const rec=readRec();try{S=Object.assign(def(),await HK.unseal(rec.blob,p));PIN=p;cur=S.contacts[0]?.id||null;applyTheme();go('circle');}catch(e){$('#lerr').textContent='PIN yanlış.';}},
 trstart(){tr={mode:'play',i:0,order:shuffle(SC.map((_,i)=>i)),picked:null,first:true,score:0};render(true);},
 trlist(){tr.mode='list';render(true);},
 async trpick(t){if(tr.picked!==null){return;}const i=+t.dataset.i;const sc=SC[tr.order[tr.i]];tr.picked=i;const good=!!sc.opts[i].g;if(good)tr.score++;S.train.done=S.train.done||{};S.train.done[sc.id]=good;await save();render(false);},
 async trnext(){if(tr.i===SC.length-1){tr.mode='end';S.train.best=Math.max(S.train.best||0,tr.score);await save();}else{tr.i++;tr.picked=null;}render(true);},
 trspeak(){const sc=SC[tr.order[tr.i]];speak(sc.title+'. '+sc.chat.filter(c=>c[0]!=='sys').map(c=>c[1]).join(' '));},
 mkreport(){const g=i=>($('#rp'+i).value||'—').trim()||'—';lastReport=`Dolandırıcılık bildirim notu\nTarih ve saat: ${g(1)}\nArayan/yazan numara: ${g(2)}\nAnlatılan: ${g(3)}\nGönderilen tutar ve banka: ${g(4)}\nIBAN ve hesap sahibi: ${g(5)}`;$('#repbox').innerHTML=`<pre class="invite" style="white-space:pre-wrap;text-align:left;font-size:.9rem">${esc(lastReport)}</pre><button class="btn sm alt" data-act="cprep">Kopyala</button>`;},
 cprep(){copy(lastReport,'Not kopyalandı');}
};
async function doWipe(){try{localStorage.removeItem(KEY);}catch(e){}S=def();PIN=null;cur=null;wipeSure=false;vres=null;applyTheme();go('onboard');}
function applyTheme(){const r=document.documentElement;if(S.settings.theme)r.dataset.theme=S.settings.theme;else delete r.dataset.theme;r.classList.toggle('big',!!S.settings.big);}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=acts[t.dataset.act];if(!a)return;try{await a(t);}catch(err){toast('Bir sorun oluştu: '+(err&&err.message||err));}});
document.addEventListener('change',async e=>{if(e.target.id==='theme'){S.settings.theme=e.target.value;applyTheme();await save();}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;const m={vin:'vcheck',qans:'qcheck',rch:'rans',pinin:'unlock'}[id];if(m){e.preventDefault();acts[m]();}});
async function boot(){
 if(!HK.supported){$('#view').innerHTML='<section class="panel bad"><h2>Bu tarayıcı desteklenmiyor</h2><p>Hakiki, güvenli şifreleme için modern bir tarayıcı gerektirir (HTTPS üzerinden açın).</p></section>';return;}
 $('#gear').onclick=()=>go('settings');
 const rec=readRec();
 if(!rec){S=def();route='onboard';render(false);return;}
 if(rec.enc){S=def();route='lock';render(false);return;}
 S=Object.assign(def(),rec.data);cur=S.contacts[0]?.id||null;applyTheme();route=S.onboarded?'circle':'onboard';render(false);}
window.__hk={get S(){return S;},go,acts,get route(){return route;},SC};
boot();
})();
</script>
